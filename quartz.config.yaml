# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 가든 — 영어교육 × AI
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: null
  locale: ko-KR
  baseUrl: chano-kr.github.io/team-hepta
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # Garnet Editorial (§9d blog): serif reading (header), Korean-safe sans chrome (body).
    typography:
      header: Newsreader
      body: Noto Serif KR
      code: JetBrains Mono
    # All OKLCH (Garnet tokens). Neutrals carry a whisper of hue 20 (not corporate gray).
    # secondary/tertiary = cool blue links (garnet reserved as the point color in custom.scss).
    colors:
      lightMode:
        light: "oklch(1 0 0)"
        lightgray: "oklch(0.915 0.006 20)"
        gray: "oklch(0.530 0.009 20)"
        darkgray: "oklch(0.235 0.006 20)"
        dark: "oklch(0.145 0.005 20)"
        secondary: "oklch(0.450 0.100 238)"
        tertiary: "oklch(0.520 0.100 235)"
        highlight: "oklch(0.955 0.010 235 / 0.6)"
        textHighlight: "oklch(0.900 0.120 95 / 0.45)"
      darkMode:
        light: "oklch(0.145 0.004 20)"
        lightgray: "oklch(0.300 0.006 20)"
        gray: "oklch(0.620 0.008 20)"
        darkgray: "oklch(0.900 0.005 20)"
        dark: "oklch(0.970 0.004 20)"
        secondary: "oklch(0.680 0.110 232)"
        tertiary: "oklch(0.760 0.100 232)"
        highlight: "oklch(0.300 0.040 235 / 0.4)"
        textHighlight: "oklch(0.550 0.100 95 / 0.4)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      # single-column layout: TOC moves inline above the article (collapsible).
      position: beforeBody
      priority: 25
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    # disabled: the satori OG renderer can't parse the site's OKLCH theme colors.
    enabled: false
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    # category nav: shows the folder taxonomy in the left rail on listing
    # (folder/tag) pages. Content pages (home + articles) are full-width = no rail.
    enabled: true
    options:
      title: 카테고리
      folderDefaultState: open
      useSavedState: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    # removed: graph view is wiki chrome, not needed for an editorial blog.
    enabled: false
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: beforeBody
      priority: 2
      group: masthead
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: afterBody
      priority: 40
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: beforeBody
      priority: 1
      group: masthead
      groupOptions:
        grow: true
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: beforeBody
      priority: 4
      group: masthead
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: beforeBody
      priority: 3
      group: masthead
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/Chano-KR
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    # disabled: was a left-toolbar mobile spacer; no left sidebar anymore.
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: true
    options:
      theme: default
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    # Masthead row: brand (page-title, grows) on the left, controls on the right.
    masthead:
      priority: 1
      direction: row
      gap: 0.75rem
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      template: full-width
      positions:
        beforeBody: []
        left: []
        right: []
    # full-width frame = single column (no sidebars); CSS caps it to a reading
    # column and centers it. Masthead lives in the `header` position.
    content:
      template: full-width
    folder:
      exclude:
        - reader-mode
    tag:
      exclude:
        - reader-mode
    canvas: {}
    bases: {}
